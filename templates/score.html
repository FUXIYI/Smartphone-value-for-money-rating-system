  .phone-info .model { font-weight: 700; color: #1e293b; font-size: 16px; }
  .phone-info .price { color: #ef4444; font-weight: 600; }

  .total-score-box {
    text-align: center; padding: 20px; background: #eff6ff;

  }
  .total-score-box .label { font-size: 14px; color: #475569; }
  .total-score-box .score {
    font-size: 42px; font-weight: 800; color: #1d4ed8; line-height: 1; margin-top: 8px;
  }
  .total-score-box .formula { font-size: 12px; color: #94a3b8; margin-top: 6px; }

  .raw-score {
    display: flex; justify-content: center; gap: 24px;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px dashed #bfdbfe;
    font-size: 13px; color: #475569;
  }
  .raw-score b { color: #1d4ed8; font-size: 15px; }

  .category {
    margin-bottom: 12px; border: 1px solid #e2e8f0;
    border-radius: 10px; overflow: hidden;
  }
  .category-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: #f8fafc; cursor: pointer;
    user-select: none; font-weight: 600; color: #334155; transition: background 0.2s;

  .category-header:hover { background: #e2e8f0; }
  .category-header .cat-name { font-size: 15px; }
  .category-header .cat-score { font-size: 14px; color: #2563eb; }
  .category-header .arrow {
    transition: transform 0.3s; margin-left: 8px; font-size: 12px; color: #64748b;
  }
  .category.open .arrow { transform: rotate(90deg); }

  .category-body {
    max-height: 0; overflow: hidden;
    transition: max-height 0.4s ease; background: #fff;
  }
  .category.open .category-body { max-height: 8000px; }

  .subcategory {
    padding: 10px 16px; border-top: 1px solid #f1f5f9;
  }
  .subcategory:first-child { border-top: none; }
  .sub-name { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; }

  .item-header {
    display: grid;
    grid-template-columns: 160px 1fr 80px;
    padding: 4px 0 6px;
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    border-bottom: 1px solid #f1f5f9;
    margin-bottom: 4px;
  }
  .item-header span:nth-child(2) { text-align: center; }
  .item-header span:nth-child(3) { text-align: right; }

  .item {
    display: grid;
    grid-template-columns: 160px 1fr 80px;
    align-items: center;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px solid #f8fafc;
  }
  .item:last-child { border-bottom: none; }
  .item .item-name { color: #334155; font-weight: 500; }
  .item .item-spec {
    text-align: center;
    color: #475569;
    font-size: 12px;
    padding: 0 8px;
  }
  .item .item-score {
    text-align: right;
    color: #2563eb;
    font-weight: 600;
  }

  /* 可跳转的硬件项：hover 变蓝，无下划线 */
  .item-name-link {
    color: #334155;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s;
  }
  .item-name-link:hover {
    color: #2563eb;
  }

  /* 缺失项：灰色显示 */
  .item.missing .item-name { color: #cbd5e1; }
  .item.missing .item-name-link { color: #cbd5e1; }
  .item.missing .item-name-link:hover { color: #94a3b8; }
  .item.missing .item-spec { color: #cbd5e1; }
  .item.missing .item-score { color: #cbd5e1; font-weight: 400; }

  .loading, .error-box {
    text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 14px;

  .error-box { color: #ef4444; }

  .btn {

    transition: transform 0.1s; margin-top: 20px;

    background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);

// ========== 从 SUB_MAP 反推完整清单 ==========
const FULL_SCHEMA = (() => {
  const schema = {};
  for (const [system, items] of Object.entries(SUB_MAP)) {
    schema[system] = {};
    for (const [itemName, subName] of Object.entries(items)) {
      (schema[system][subName] ??= []).push(itemName);
    }
  }
  return schema;
})();

// ========== 组装 categories（含缺失项） ==========
function buildCategories(result) {
  const index = {};
  result.details.forEach(d => {
    index[d.system] ??= {};
    index[d.system][d.item] = { value: d.value, score: d.score };
  });

  return CATEGORY_ORDER.map(sys => {
    const subcats = FULL_SCHEMA[sys] || {};
    const subList = Object.entries(subcats).map(([subName, itemNames]) => {
      const items = itemNames.map(itemName => {
        const hit = index[sys]?.[itemName];
        if (hit) {
          return { name: itemName, spec: hit.value, score: hit.score, has: true };
        }
        return { name: itemName, spec: "—", score: "—", has: false };
      });
      return { name: subName, items };
    });

    return {
      name: sys,
      score: result.system_scores[sys] || 0,
      subcategories: subList,
    };
  });
}

// ========== 渲染 ==========
function renderWithData(result) {
  document.getElementById('phoneInfo').innerHTML =
    `<div class="model">${result.phone}</div>
     <div class="price">到手价：${result.price} 元</div>`;

  document.getElementById('totalScore').textContent = result["性价比分"];
  document.getElementById('rawScore').textContent = result.total + ' 分';
  document.getElementById('rawPrice').textContent = result.price + ' 元';

  const categories = buildCategories(result);

  let html = '';
  categories.forEach((cat, ci) => {
    const openClass = ci === 0 ? ' open' : '';
    html += `
      <div class="category${openClass}" id="cat-${ci}">
        <div class="category-header" onclick="toggleCat(${ci})">
          <span class="cat-name">${cat.name}</span>
          <span style="display:flex;align-items:center">
            <span class="cat-score">${cat.score} 分</span>
            <span class="arrow">▶</span>
          </span>
        </div>
        <div class="category-body">`;

    cat.subcategories.forEach(sub => {
      html += `
        <div class="subcategory">
          <div class="sub-name">${sub.name}</div>
          <div class="item-header">
            <span>硬件项</span>
            <span>规格</span>
            <span>分数</span>
          </div>`;
      sub.items.forEach(it => {
        // 所有硬件项都是链接
        const mapping = ITEM_TO_RULE_KEY[it.name];
        const nameHtml = mapping
          ? `<a class="item-name-link" target="_blank" rel="noopener" href="rules.html?cat=${encodeURIComponent(mapping.cat)}&key=${encodeURIComponent(mapping.key)}">${it.name}</a>`
          : `<span class="item-name">${it.name}</span>`;

        if (it.has) {
          html += `
            <div class="item">
              ${nameHtml}
              <span class="item-spec">${it.spec}</span>
              <span class="item-score">${it.score} 分</span>
            </div>`;
        } else {
          html += `
            <div class="item missing">
              ${nameHtml}
              <span class="item-spec">—</span>
              <span class="item-score">—</span>
            </div>`;
        }
      });
      html += `</div>`;
    });

    html += `</div></div>`;
  });

  document.getElementById('content').innerHTML = html;
}

function toggleCat(i) {
  document.getElementById(`cat-${i}`).classList.toggle('open');
}

// ========== 请求后端 ==========
async function loadScore() {
  if (urlParams.get("temp") === "1") {
    const raw = sessionStorage.getItem("temp_result");
    if (!raw) {
      document.getElementById("content").innerHTML =
        '<div class="error-box">临时数据已丢失，请返回重新操作</div>';
      return;
    }
    try {
      const result = JSON.parse(raw);
      sessionStorage.removeItem("temp_result");
      renderWithData(result);
    } catch (e) {
      document.getElementById("content").innerHTML =
        '<div class="error-box">数据解析失败</div>';
    }
    return;
  }

  if (!phoneName) {
    document.getElementById('content').innerHTML =
      '<div class="error-box">缺少机型参数，请返回首页重新选择</div>';
    return;
  }
  if (!price || price <= 0) {
    document.getElementById('content').innerHTML =
      '<div class="error-box">价格无效，请返回首页重新填写</div>';
    return;
  }

  try {
    const res = await fetch(
      `/api/score_by_phone?phone=${encodeURIComponent(phoneName)}&price=${price}`
    );
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    const result = await res.json();
    renderWithData(result);
  } catch (err) {
    document.getElementById('content').innerHTML =
      `<div class="error-box">加载失败：${err.message}</div>`;
  }
}

loadScore();
