<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>自定义添加机型 - 手机性价比打分系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 45%, #ffffff 100%);
    color: #1e293b;
    min-height: 100vh;
    padding: 32px 20px 100px;
  }

  .container { max-width: 820px; margin: 0 auto; }

  h1 {
    text-align: center; font-size: 22px; color: #1d4ed8;
    margin-bottom: 6px; font-weight: 700;
  }
  .subtitle {
    text-align: center; color: #64748b; font-size: 13px;
    margin-bottom: 24px;
  }

  .card {
    background: #ffffff; border: 1px solid #e2e8f0;
    border-radius: 14px; padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.05);
  }

  .basic-info {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  @media (max-width: 560px) { .basic-info { grid-template-columns: 1fr; } }

  .hint-text {
    font-size: 13px; color: #2563eb; background: #eff6ff;
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid #bfdbfe; margin-top: 14px;
  }

  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 13px; color: #475569; margin-bottom: 6px; font-weight: 500;
  }
  .field label .required { color: #ef4444; }

  .field input[type="text"],
  .field input[type="number"],
  .field select {
    width: 100%; padding: 9px 11px;
    background: #f8fafc; border: 1.5px solid #cbd5e1;
    border-radius: 8px; color: #1e293b; font-size: 13px;
    outline: none; transition: border-color 0.15s, background 0.15s;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    border-color: #3b82f6; background: #ffffff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
  }
  .field input::placeholder { color: #94a3b8; }

  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .field input[type="number"] { appearance: textfield; -moz-appearance: textfield; }

  /* ========== 可搜索下拉 ========== */
  .searchable-select { position: relative; }

  .searchable-select input {
    width: 100%;
    padding: 9px 32px 9px 11px;
    background: #f8fafc; border: 1.5px solid #cbd5e1;
    border-radius: 8px; color: #1e293b; font-size: 13px;
    outline: none; transition: border-color 0.15s, background 0.15s;
    font-family: inherit;
    cursor: text;
  }
  .searchable-select input:focus {
    border-color: #3b82f6; background: #ffffff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
  }
  .searchable-select input::placeholder { color: #94a3b8; }

  .searchable-select .clear-btn {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    background: #cbd5e1; color: #fff;
    border: none; border-radius: 50%;
    font-size: 12px; line-height: 1;
    cursor: pointer; padding: 0;
    display: none;
    font-family: inherit;
  }
  .searchable-select.has-value .clear-btn { display: block; }
  .searchable-select .clear-btn:hover { background: #94a3b8; }

  .searchable-select .select-dropdown {
    position: absolute;
    top: 100%; left: 0; right: 0;
    max-height: 240px; overflow-y: auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    margin-top: 4px;
    display: none;
    z-index: 1000;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
    list-style: none;
  }
  .searchable-select:focus-within { z-index: 500; }
  .searchable-select .select-dropdown.active { display: block; }

  .searchable-select .select-dropdown li {
    padding: 8px 12px;
    font-size: 13px;
    color: #334155;
    cursor: pointer;
    border-bottom: 1px solid #f8fafc;
    transition: background 0.1s, color 0.1s;
  }
  .searchable-select .select-dropdown li:last-child { border-bottom: none; }
  .searchable-select .select-dropdown li:hover {
    background: #eff6ff; color: #1d4ed8;
  }
  .searchable-select .select-dropdown li.selected {
    background: #dbeafe; color: #1d4ed8; font-weight: 600;
  }
  .searchable-select .select-dropdown li.empty {
    color: #94a3b8; cursor: default; text-align: center; padding: 14px;
  }
  .searchable-select .select-dropdown li.empty:hover {
    background: transparent; color: #94a3b8;
  }

  .searchable-select .select-dropdown::-webkit-scrollbar { width: 6px; }
  .searchable-select .select-dropdown::-webkit-scrollbar-thumb {
    background: #cbd5e1; border-radius: 3px;
  }
  .searchable-select .select-dropdown::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* ========== checkbox 字段 ========== */
  .checkbox-field {
    flex-direction: row;
    align-items: center;
    padding: 9px 11px;
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .checkbox-field:hover { border-color: #93c5fd; background: #eff6ff; }
  .checkbox-field input { margin-right: 8px; cursor: pointer; }
  .checkbox-field span { font-size: 13px; color: #334155; }

  /* ========== 折叠面板 ========== */
  details.panel {
    background: #ffffff; border: 1px solid #e2e8f0;
    border-radius: 12px; margin-bottom: 10px;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  details.panel[open] {
    border-color: #93c5fd;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.08);
  }
  details.panel > summary {
    list-style: none; cursor: pointer;
    padding: 14px 20px;
    font-size: 15px; color: #1d4ed8; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none; transition: background 0.15s;
    border-radius: 12px;
  }
  details.panel[open] > summary {
    border-radius: 12px 12px 0 0;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary:hover { background: #eff6ff; }
  details.panel > summary .arrow {
    font-size: 12px; color: #64748b;
    transition: transform 0.25s;
  }
  details.panel[open] > summary .arrow { transform: rotate(90deg); }

  .panel-body {
    padding: 6px 20px 20px;
    border-top: 1px solid #f1f5f9;
  }

  /* ========== 子类别区块 ========== */
  .subcat-block {
    margin-bottom: 18px;
  }
  .subcat-block:last-child { margin-bottom: 0; }

  .subcat-title {
    font-size: 13px;
    color: #2563eb;
    font-weight: 700;
    padding: 8px 12px;
    background: #eff6ff;
    border-left: 3px solid #3b82f6;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } }

  .field.full-width { grid-column: 1 / -1; }
  .expand-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }

  /* ========== 底部操作栏 ========== */
  .actions {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid #e2e8f0;
    padding: 14px 20px;
    display: flex; gap: 12px;
    justify-content: center;
    z-index: 50;
  }
  .actions .btn { max-width: 220px; }

  .btn {
    flex: 1;
    padding: 13px 20px;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.30);
  }
  .btn-primary:hover { box-shadow: 0 6px 18px rgba(37, 99, 235, 0.40); }

  .btn-secondary {
    background: #ffffff; color: #2563eb;
    border: 1.5px solid #bfdbfe;
  }
  .btn-secondary:hover { background: #eff6ff; border-color: #93c5fd; }

  .error-tip {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #ef4444; color: #fff;
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
    display: none; z-index: 1000;
  }
  .error-tip.show { display: block; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; top: 10px; } to { opacity: 1; top: 20px; } }

  .loading, .error-box {
    text-align: center; padding: 60px 20px; color: #94a3b8; font-size: 14px;
  }
  .error-box { color: #ef4444; }
</style>
</head>
<body>

<div class="container">
  <h1>🔧 自定义添加机型</h1>
  <div class="subtitle">选择硬件参数后可以直接打分，也可以保存到本地机型库</div>

  <div class="card">
    <div class="basic-info">
      <div class="field">
        <label>手机名称 <span class="required">*</span></label>
        <input type="text" id="customName" placeholder="如：我的测试手机" autocomplete="off" />
      </div>
      <div class="field">
        <label>到手价格（元） <span class="required">*</span></label>
        <input type="number" id="customPrice" placeholder="请输入实际到手价格" min="0" />
      </div>
    </div>
    <div class="hint-text">💡 精细打分的输入框支持搜索：输入关键词（如 "骁龙"、"f/1.4"）即可过滤。留空的项不参与计分。</div>
  </div>

  <div id="panels">
    <div class="loading">加载中...</div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-secondary" onclick="startScore(false)">开始打分（不保存）</button>
  <button class="btn btn-primary" onclick="startScore(true)">保存并打分</button>
</div>

<div class="error-tip" id="errorTip"></div>

<script>
// ========== 精细项配置（扁平：key → 配置） ==========
const PRECISION_BY_KEY = {
  // 一、核心计算单元
  soc:            { label: "SoC 型号",   optionsKey: "soc",            valueKey: "型号" },
  ram:            { label: "RAM 代次",   optionsKey: "ram",            valueKey: "版本" },

  brightness_hbm:        { label: "HBM全屏激发亮度", optionsKey: "brightness_hbm",       valueKey: "亮度" },

  // 三、影像系统
  main_sensor_size:  { label: "传感器尺寸", optionsKey: "main_sensor_size",  valueKey: "尺寸" },
  main_pixel:        { label: "像素",       optionsKey: "main_pixel",        valueKey: "像素" },
  main_aperture:     { label: "光圈",       optionsKey: "main_aperture",     valueKey: "光圈" },
  main_ois:          { label: "OIS",        optionsKey: "main_ois",          valueKey: "等级" },

  tele_pixel:        { label: "像素",       optionsKey: "tele_pixel",        valueKey: "像素" },
  tele_zoom:         { label: "光学变焦",   optionsKey: "tele_zoom",         valueKey: "变焦" },
  tele_sensor_size:  { label: "传感器尺寸", optionsKey: "tele_sensor_size",  valueKey: "尺寸" },
  tele_ois:          { label: "OIS",        optionsKey: "tele_ois",          valueKey: "等级" },

  front_sensor_size: { label: "传感器尺寸", optionsKey: "front_sensor_size", valueKey: "尺寸" },

  // 四、能源系统
  battery_capacity:          { label: "电池容量",     optionsKey: "battery_capacity",          valueKey: "区间" },
  battery_density:           { label: "电池能量密度", optionsKey: "battery_density",           valueKey: "区间" },
  wired_charging:            { label: "有线充电",     optionsKey: "wired_charging",            valueKey: "区间" },
  wireless_charging:         { label: "无线充电",     optionsKey: "wireless_charging",         valueKey: "区间" },
  reverse_wireless_charging: { label: "反向无线充电", optionsKey: "reverse_wireless_charging", valueKey: "区间" },

  // 五、机身结构
  frame_material:   { label: "中框材质",      optionsKey: "frame_material",   valueKey: "材质" },
  device_weight:    { label: "机身重量",      optionsKey: "device_weight",    valueKey: "区间" },
  ip_rating:        { label: "IP 防护等级",   optionsKey: "ip_rating",        valueKey: "等级" },
  vc_heat_pipe:     { label: "VC 均热板面积", optionsKey: "vc_heat_pipe",     valueKey: "区间" },
  graphene_cooling: { label: "石墨烯散热",    optionsKey: "graphene_cooling", valueKey: "类型" },

  // 六、通信模块
  wifi:      { label: "WiFi 版本", optionsKey: "wifi",      valueKey: "版本" },
  bluetooth: { label: "蓝牙版本",  optionsKey: "bluetooth", valueKey: "版本" },

  // 八、其他硬件
  usb_c:     { label: "USB 接口",     optionsKey: "usb_c",     valueKey: "协议" },
  usb_video: { label: "USB 视频输出", optionsKey: "usb_video", valueKey: "协议" },
  sim_slot:  { label: "SIM 卡槽",     optionsKey: "sim_slot",  valueKey: "方案" },
  speaker:   { label: "扬声器",       optionsKey: "speaker",   valueKey: "方案" },

// ========== 子类别分组：大类 → 子类 → [精细 key 或 简单硬件项名] ==========
const SUBCATEGORY_MAP = {
  "一、核心计算单元": {
    "处理器（SoC）": ["soc", "影像协处理器", "AI协处理器", "安全协处理器", "游戏独显芯片", "触控IC"],
    "存储系统":      ["ram", "ram_capacity", "rom", "capacity", "expand_storage"],
  },
  "二、显示系统": {
    "屏幕模组":   ["panel_type", "resolution", "refresh_rate",
                    "touch_sampling_cont", "touch_sampling_peak",
                    "brightness_manual", "brightness_local_peak", "brightness_hbm",
                    "ppi", "疏油层"],
    "防护玻璃":   ["盖板材质"],
  },
  "三、影像系统": {
    "后置摄像头-主摄":       ["main_sensor_size", "main_pixel", "main_aperture", "main_ois"],
    "后置摄像头-超广角":     ["ultra_sensor_size", "ultra_fov", "ultra_pixel", "ultra_aperture",
                              "ultra_ois", "自动对焦/微距"],
    "后置摄像头-长焦":       ["tele_pixel", "tele_zoom", "tele_sensor_size", "tele_ois",
                              "激光对焦传感器"],
    "后置摄像头-辅助传感器": ["色温传感器", "Flicker传感器", "多光谱传感器"],
    "前置摄像头":            ["front_wide_pixel", "front_fov", "front_sensor_size", "front_pixel",
                              "自动对焦（AF）", "3D结构光模块", "深感摄像头"],
    "光学组件":              ["镜头组", "闪光灯", "镀膜技术", "OIS光学防抖马达", "自研影像芯片"],
    "影像附加硬件":          ["物理变焦环", "色彩摄像头"],
  },
  "四、能源系统": {
    "电池":           ["battery_capacity", "battery_density", "双电芯设计"],
    "充电模块-有线":  ["wired_charging", "充电兼容档位"],
    "充电模块-无线":  ["wireless_charging", "reverse_wireless_charging"],
    "电源管理芯片":   ["电源管理芯片(PMIC)", "电池管理芯片", "快充芯片"],
  },
  "五、机身结构": {
    "外壳材质":  ["frame_material", "背板材质", "device_weight"],
    "防护等级":  ["ip_rating"],
    "散热系统":  ["vc_heat_pipe", "graphene_cooling", "主动散热"],
  },
  "六、通信模块": {
    "蜂窝网络":    ["频段支持", "射频增强芯片", "eSIM芯片"],
    "短距离通信":  ["wifi", "bluetooth", "NFC芯片", "红外遥控", "星闪模块", "UWB超宽带芯片"],
    "卫星通信":    ["天通卫星芯片", "北斗卫星芯片", "GPS/GNSS", "卫星通话/短信"],
  },
  "七、传感器系统": {
    "环境感知":    ["光线传感器", "气压计", "湿度传感器", "空气质量传感器", "紫外线传感器"],
    "运动感知":    ["陀螺仪", "加速度传感器", "指南针/电子罗盘"],
    "生物识别":    ["指纹传感器类型"],
    "辅助传感器":  ["红外传感器", "霍尔传感器", "距离传感器", "心率传感器"],
  },
  "八、其他硬件": {
    "音频系统":     ["speaker", "音频解码芯片", "麦克风阵列"],
    "接口与扩展":   ["usb_c", "usb_video", "sim_slot", "3.5mm耳机孔"],
  },
};

// ========== 全局状态 ==========
let RULES = null;
let SIMPLE_BY_NAME = {};       // 硬件项名 → 规则对象（取第一条）
let SIMPLE_VARIANTS = {};      // 硬件项名 → 全部规则对象列表（用于 select 的多个选项）
const precisionCollectors = {};
const simpleCollectors = {};

// ========== 初始化 ==========
async function init() {
  try {
    const res = await fetch("/api/rules");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    RULES = await res.json();
  } catch (err) {
    document.getElementById("panels").innerHTML =
      `<div class="error-box">加载失败：${err.message}</div>`;
    return;
  }

  // 建立简单项索引
  (RULES.simple_scoring || []).forEach(s => {
    const name = s["硬件项"];
    (SIMPLE_VARIANTS[name] ??= []).push(s);
    if (!SIMPLE_BY_NAME[name]) SIMPLE_BY_NAME[name] = s;
  });

  renderPanels();
}

// ========== 可搜索下拉 ==========
function makeSearchableSelect(options, placeholder = "点击或输入关键词搜索...") {
  const wrap = document.createElement("div");
  wrap.className = "searchable-select";

  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = placeholder;
  input.autocomplete = "off";
  input.spellcheck = false;

  const clearBtn = document.createElement("button");
  clearBtn.type = "button";
  clearBtn.className = "clear-btn";
  clearBtn.textContent = "×";
  clearBtn.title = "清除";

  const list = document.createElement("ul");
  list.className = "select-dropdown";

  let currentValue = "";

  function renderList(filter) {
    list.innerHTML = "";
    const q = (filter || "").toLowerCase().trim();
    const matched = q
      ? options.filter(o => o.search.toLowerCase().includes(q))
      : options;

    if (matched.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "无匹配项";
      list.appendChild(li);
      return;
    }

    matched.forEach(o => {
      const li = document.createElement("li");
      li.textContent = o.label;
      if (String(o.value) === String(currentValue)) li.classList.add("selected");
      li.onmousedown = (e) => {
        e.preventDefault();
        input.value = o.label;
        currentValue = o.value;
        wrap.classList.add("has-value");
        list.classList.remove("active");
      };
      list.appendChild(li);
    });
  }

  input.addEventListener("focus", () => {
    renderList("");
    list.classList.add("active");
  });

  input.addEventListener("input", () => {
    currentValue = "";
    wrap.classList.remove("has-value");
    renderList(input.value);
    list.classList.add("active");
  });

  clearBtn.addEventListener("click", () => {
    input.value = "";
    currentValue = "";
    wrap.classList.remove("has-value");
    renderList("");
    input.focus();
  });

  document.addEventListener("click", (e) => {
    if (!wrap.contains(e.target)) list.classList.remove("active");
  });

  wrap.appendChild(input);
  wrap.appendChild(clearBtn);
  wrap.appendChild(list);

  return {
    el: wrap,
    getValue: () => (currentValue === "" ? null : currentValue),
  };
}

// ========== 渲染 8 个面板 ==========
function renderPanels() {
  const container = document.getElementById("panels");
  container.innerHTML = "";

  RULES.categories.forEach(cat => {
    const panel = document.createElement("details");
    panel.className = "panel";

    const summary = document.createElement("summary");
    summary.innerHTML = `<span>${cat}</span><span class="arrow">▶</span>`;
    panel.appendChild(summary);

    const body = document.createElement("div");
    body.className = "panel-body";

    const subMap = SUBCATEGORY_MAP[cat] || {};

    Object.entries(subMap).forEach(([subName, itemList]) => {
      const block = document.createElement("div");
      block.className = "subcat-block";

      const title = document.createElement("div");
      title.className = "subcat-title";
      title.textContent = subName;
      block.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "field-grid";

      itemList.forEach(item => {
        // 判断是精细 key 还是简单项名
        if (PRECISION_BY_KEY[item]) {
          const field = PRECISION_BY_KEY[item];
          const created = field.special === "expand"
            ? makeExpandStorageField()
            : makePrecisionField(field);
          grid.appendChild(created.el);
          precisionCollectors[item] = created;
        } else if (SIMPLE_BY_NAME[item]) {
          const rule = SIMPLE_BY_NAME[item];
          const created = makeSimpleField(rule, SIMPLE_VARIANTS[item] || []);
          grid.appendChild(created.el);
          simpleCollectors[item] = created;
        }
      });

      block.appendChild(grid);
      body.appendChild(block);
    });

    panel.appendChild(body);
    container.appendChild(panel);
  });
}

// ========== 精细项：可搜索下拉 ==========
function makePrecisionField(field) {
  const opts = RULES[field.optionsKey] || [];
  const isNumField = field.valueKey === "容量_GB";

  const options = opts.map(o => {
    const v = o[field.valueKey];
    return {
      value: isNumField ? parseInt(v) : String(v),
      label: `${v}（${o["分数"]}分）`,
      search: String(v),
    };
  });

  const wrap = document.createElement("div");
  wrap.className = "field";

  const label = document.createElement("label");
  label.textContent = field.label;
  wrap.appendChild(label);

  const sel = makeSearchableSelect(options);
  wrap.appendChild(sel.el);

  return {
    el: wrap,
    getValue: () => sel.getValue(),
  };
}

// ========== 扩展存储 ==========
function makeExpandStorageField() {
  const wrap = document.createElement("div");
  wrap.className = "field full-width";

  const label = document.createElement("label");
  label.textContent = "扩展存储";
  wrap.appendChild(label);

  const row = document.createElement("div");
  row.className = "expand-row";

  const selType = document.createElement("select");
  RULES.expand_storage.card_types.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.type;
    opt.textContent = t.说明;
    selType.appendChild(opt);
  });

  const selCap = document.createElement("select");

  function refreshCap() {
    const type = selType.value;
    selCap.innerHTML = "";
    if (type === "无") {
      selCap.disabled = true;
      const opt = document.createElement("option");
      opt.textContent = "—";
      selCap.appendChild(opt);
      return;
    }
    selCap.disabled = false;
    const list = type === "TF卡"
      ? RULES.expand_storage.tf_capacities
      : RULES.expand_storage.nm_capacities;
    list.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c["容量_GB"];
      opt.textContent = `${c["容量_GB"]}GB（${c["分数"]}分）`;
      selCap.appendChild(opt);
    });
  }

  selType.onchange = refreshCap;
  refreshCap();

  row.appendChild(selType);
  row.appendChild(selCap);
  wrap.appendChild(row);

  return {
    el: wrap,
    getValue: () => {
      const type = selType.value;
      if (type === "无") return { card_type: "无", capacity_gb: 0 };
      return { card_type: type, capacity_gb: parseInt(selCap.value) };
    },
  };
}

// ========== 简单项 ==========
function makeSimpleField(rule, variants) {
  const name = rule["硬件项"];
  const type = rule["类型"];

  if (type === "has") {
    const wrap = document.createElement("label");
    wrap.className = "checkbox-field";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    wrap.appendChild(cb);

    const span = document.createElement("span");
    span.textContent = name;
    wrap.appendChild(span);

    return { el: wrap, getValue: () => (cb.checked ? rule["规则"] : null) };
  }

  if (type === "select") {
    const wrap = document.createElement("div");
    wrap.className = "field";

    const label = document.createElement("label");
    label.textContent = name;
    wrap.appendChild(label);

    const sel = document.createElement("select");
    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "（不填）";
    sel.appendChild(empty);

    variants.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r["规则"];
      opt.textContent = `${r["规则"]}（${r["分数"]}分）`;
      sel.appendChild(opt);
    });

    wrap.appendChild(sel);
    return { el: wrap, getValue: () => sel.value || null };
  }

  if (type === "count") {
    const wrap = document.createElement("div");
    wrap.className = "field";

    const label = document.createElement("label");
    label.textContent = name + "（数量）";
    wrap.appendChild(label);

    const inp = document.createElement("input");
    inp.type = "number";
    inp.min = 0;
    inp.placeholder = "输入数量";
    wrap.appendChild(inp);

    return {
      el: wrap,
      getValue: () => {
        const v = parseInt(inp.value);
        return isNaN(v) || v <= 0 ? null : v;
      },
    };
  }

  const empty = document.createElement("div");
  return { el: empty, getValue: () => null };
}

// ========== 收集配置 ==========
function collectConfig() {
  const config = { simple: {} };

  for (const [key, field] of Object.entries(precisionCollectors)) {
    const v = field.getValue();
    if (v !== null && v !== undefined && v !== "") {
      config[key] = v;
    }
  }

  for (const [name, field] of Object.entries(simpleCollectors)) {
    const v = field.getValue();
    if (v !== null && v !== undefined && v !== "") {
      config.simple[name] = v;
    }
  }

  if (Object.keys(config.simple).length === 0) delete config.simple;
  return config;
}

// ========== 错误提示 ==========
function showError(msg) {
  const el = document.getElementById("errorTip");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3000);
}

// ========== 打分 ==========
async function startScore(save) {
  const name = document.getElementById("customName").value.trim();
  const price = parseFloat(document.getElementById("customPrice").value);

  if (!name) { showError("请填写手机名称"); return; }
  if (!price || price <= 0) { showError("请填写有效的到手价格"); return; }

  const config = collectConfig();
  const precisionCount = Object.keys(config).filter(k => k !== "simple").length;
  const simpleCount = Object.keys(config.simple || {}).length;

  if (precisionCount === 0 && simpleCount === 0) {
    showError("请至少填写一个硬件项");
    return;
  }

  if (save) {
    try {
      const res = await fetch("/api/custom_phone", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, config, overwrite: true }),
      });
      const data = await res.json();
      if (data.error) { showError(data.error); return; }
      window.location.href = `score.html?phone=${encodeURIComponent(name)}&price=${price}`;
    } catch (err) {
      showError("保存失败：" + err.message);
    }
  } else {
    try {
      const res = await fetch("/api/score_custom", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: name, price, config }),
      });
      const result = await res.json();
      if (result.error) { showError(result.error); return; }
      sessionStorage.setItem("temp_result", JSON.stringify(result));
      window.location.href = "score.html?temp=1";
    } catch (err) {
      showError("打分失败：" + err.message);
    }
  }
}

init();
